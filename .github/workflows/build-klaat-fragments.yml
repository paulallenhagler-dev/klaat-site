name: Build KLAAT hidden audio fragments

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_klaat_fragments.py'
      - '.github/workflows/build-klaat-fragments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fragments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure audio tooling
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Extract and fade original sonic passages
        run: python3 scripts/build_klaat_fragments.py
      - name: Save finished audio excerpts and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/klaat-fragments/
          git diff --cached --quiet && exit 0
          git commit -m "Publish 24 KLAAT audio fragments from full performance"
          git push origin HEAD:main
