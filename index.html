 if(mode==="dust"){rings(cx,cy,r*.58,11,t,.2);dust(t,260, mobile?W*.5:W*.56,cy,r*1.6,index);cross(cx,cy,4)}
 if(mode==="veil"){for(let i=-13;i<=13;i++){ctx.beginPath();for(let k=0;k<=90;k++){let q=k/90,y=H*(mobile?.26:.14)+q*H*.76,x=cx+i*4.4+Math.sin(q*12+t*.38+i*.17)*r*.24*q;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle="rgba(218,211,197,"+(.10+.21*(1-Math.abs(i)/14))+")";ctx.lineWidth=.7;ctx.stroke()}}
 if(mode==="glyph"){guide(cx,cy,r*.95);for(let i=0;i<4;i++){let x=cx+(i-1.5)*r*.75, y=cy+Math.sin(i*1.8)*r*.1;ctx.beginPath();ctx.arc(x,y,r*.23,.18+i*.2,Math.PI*1.78+i*.1);ctx.strokeStyle="rgba(219,211,196,.36)";ctx.lineWidth=.8;ctx.stroke();dot(x,y,2.4,i===0?C.red:C.bone,.87)}}
 // Five distinct parametric studies: 12 new chambers, subtly different per seed.

 if(mode==="wake"){
   guide(cx,cy,r*.91);rings(cx,cy,r*.86,15,t+.17*index,.38);

     ctx.beginPath();

   }
   dot(cx,cy,3,C.rust,.95);
 }
 if(mode==="moire"){
   const width=mobile?W*.68:W*.67,height=Math.min(H*.63,630);
   const originX=mobile?W*.19:W*.13,originY=cy-height*.43;
   for(let family=0;family<2;family++)for(let line=0;line<21;line++){
     ctx.beginPath();
     for(let j=0;j<=57;j++){
       const q=j/57,x=originX+q*width;
       const drift=Math.sin(q*(10+family*5)-t*.36+line*.31+index*.09)*7.5;
       const lean=(family?-1:1)*q*(line-10)*4;
       const y=originY+line*height/32+drift+lean+Math.sin(q*8+t*.23+line*.4)*4;
       if(!j)ctx.moveTo(x,y);else ctx.lineTo(x,y);
     }
     ctx.strokeStyle="rgba(222,213,198,"+(.09+.11*Math.sin((line+family*8)*.24)**2)+")";
     ctx.lineWidth=.65;ctx.stroke();
   }
   dot(originX+width*.55,cy,2.8,index%2?C.teal:C.rust,.87);
 }
 if(mode==="rays"){
   const ox=mobile?W*.37:W*.29,oy=cy-.06*r,extent=mobile?W*.57:W*.64;
   for(let j=0;j<24;j++){
     ctx.beginPath();
     const tilt=(j-12)*.095+Math.sin(index)*.06;
     for(let k=0;k<=55;k++){
       const q=k/55,v=q*extent,x=ox+v*Math.cos(tilt);
       const y=oy+v*Math.sin(tilt)*.66+Math.sin(q*19-t*.53+j*.39)*q*(2+signalEnergy*10);
       if(!k)ctx.moveTo(x,y);else ctx.lineTo(x,y);
     }
     ctx.strokeStyle="rgba(224,215,200,"+(.065+(24-Math.abs(j-12))/215)+")";
     ctx.lineWidth=.68;ctx.stroke();
   }
   for(let k=0;k<9;k++){
     const rr=18+k*17;
     ctx.beginPath();ctx.ellipse(ox,oy,rr,rr*.8,.3,-Math.PI*.6+index*.04,Math.PI*.83+index*.04);
     ctx.strokeStyle="rgba(218,205,188,"+(.3-k*.023)+")";ctx.lineWidth=.68;ctx.stroke();
   }
   dust(t,mobile?75:120,ox+extent*.55,cy,r*1.3,index);dot(ox,oy,3.4,C.red,.95);
 }
 if(mode==="fracture2"){
   const left=mobile?W*.48:W*.39,rr=Math.min(r*.98,H*.28);
   rings(left,cy,rr,17,t+.1*index,.58);
   for(let strand=-14;strand<=14;strand++){
     ctx.beginPath();const yy=cy+strand*rr*.085;
     for(let j=0;j<=35;j++){
       const u=j/35,xx=left+rr*(.18+u*(mobile?.91:2.1));
       const y=yy+Math.sin(u*(9+index%5)-t*.67+strand*.27)*(3+10*u);
       if(!j)ctx.moveTo(xx,y);else ctx.lineTo(xx,y);
     }
     ctx.strokeStyle="rgba(222,210,191,"+(.075+(14-Math.abs(strand))*.011)+")";
     ctx.lineWidth=.66;ctx.stroke();
   }
   cross(left,cy,3.1);dust(t,70,left+r*.6,cy,r*1.25,index);
 }
 if(mode==="dust2"){
   const ox=mobile?W*.48:W*.35,oy=cy-r*.1;
   rings(ox,oy,r*.67,12,t+.13*index,.67);
   dust(t,mobile?210:390,ox+(mobile?W*.10:W*.16),oy,r*2.4,index);
   for(let curl=0;curl<4;curl++){
     ctx.beginPath();
     for(let j=0;j<=105;j++){
       const a=j/105*Math.PI*2.25,rad=21+a*(7+curl*2.1);
       const xx=ox+Math.cos(a+t*.08+curl*.7)*rad;
       const yy=oy+Math.sin(a+t*.07+curl*.7)*rad*.65;
       if(!j)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
     }
     ctx.strokeStyle="rgba(221,213,200,"+(.13+curl*.043)+")";ctx.lineWidth=.6;ctx.stroke();
   }
   dot(ox,oy,2.9,index%2?C.teal:C.rust,.93);
 }
 if(mode!=="dust"&&!["wake","moire","rays","fracture2","dust2"].includes(mode))dust(t,26,mobile?W*.5:W*.6,cy,r*1.7,index);
}
function draw(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#080808";ctx.fillRect(0,0,W,H);
 if(current==="home")drawHome(t);else if(!approvedArt[current]){let s=pages[current];roomArt(s.mode,s.index,t)}
 if(hover!==-1){let b=layer.children[hover];if(b){let r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(x,y,21+i*13+Math.sin(t*1.4+i)*2,0,Math.PI*2);ctx.strokeStyle="rgba(211,204,186,"+(.12/(i+1))+")";ctx.lineWidth=.7;ctx.stroke()}}}
}

 if(current==="home"){
  if(!mobile)return [[.236,.505],[.112,.505],[.53,.51],[.78,.60],[.65,.40],[.91,.52],[.37,.70]];
  return [[.5,.425],[.20,.45],[.76,.56],[.23,.70],[.75,.72],[.51,.68],[.50,.83]];
 }
 if(approvedArt[current]){const r=approvedBounds();return approvedMarks[current].map(p=>[(r.left+p[0]*r.width)/W,(r.top+p[1]*r.height)/H])}
 if(!mobile)return [[.40,.52],[.59,.43],[.76,.61],[.28,.30]];
 return [[.50,.45],[.73,.42],[.70,.63],[.28,.62]];
}
function destinations(){return current==="home"?homeDest:pages[current].links}
function placeNodes(){
 if(!W||!H)return;
 layer.replaceChildren();hover=-1;const pts=placements(),targets=destinations();
 targets.forEach(function(dest,i){
  const a=document.createElement("button"),action=dest==="@audio"?"audio":dest==="@read"||dest[0]==="/"?"read":dest==="@observe"?"observe":"portal";
  a.className="node "+action+(approvedArt[current]?" approved":"");a.type="button";a.style.setProperty("--x",(pts[i][0]*100)+"%");a.style.setProperty("--y",(pts[i][1]*100)+"%");
  a.style.setProperty("--col",action==="audio"?C.teal:action==="read"?C.bone:action==="observe"?C.purple:i%3===0?C.red:C.rust);
  a.style.setProperty("--dot",i===0?"7px":(action==="audio"?"5.5px":"4.5px"));
   a.style.setProperty("--pulse-time",(5.2+(i*7%6)*.31+(current==="home"?.0:.32))+"s");
   a.style.setProperty("--pulse-offset",(-i*.83-(i%3)*.26)+"s");
  const targetName=meta[dest]?.[0]||dest;
  a.setAttribute("aria-label",action==="audio"?"Play a KLAAT sound variation":action==="read"?"Read the full Atlas":action==="observe"?"Reveal another observation":"Enter "+targetName);
  a.title=action==="audio"?"SOUND":action==="read"?"ATLAS":action==="observe"?"OBSERVATION":targetName;

  a.addEventListener("mouseenter",function(){hover=i;hint.classList.add("disappear")});a.addEventListener("mouseleave",function(){hover=-1});
  a.addEventListener("focus",function(){hover=i});a.addEventListener("blur",function(){hover=-1});
  a.addEventListener("click",function(){
   a.classList.add("tapped");
   if(action==="audio"){
     const last=currentMode;let next=Math.floor(Math.random()*audioModes.length);
     if(next===last)next=(next+1)%audioModes.length;
     if(approvedArt[current])resonanceAt(approvedMarks[current][i][0],approvedMarks[current][i][1],"audio");
     playVariation(next);return
   }
   if(action==="read"){if(typeof window.gtag==="function")window.gtag("event","atlas_open",{from_portal:current});location.href=dest[0]==="/"?dest:"/edition.html";return}
   if(action==="observe"){
     showInscription(meta[current]?.[2]||"");
     if(approvedArt[current])resonanceAt(approvedMarks[current][i][0],approvedMarks[current][i][1],"observe");
     return
   }
   if(approvedArt[current])resonanceAt(approvedMarks[current][i][0],approvedMarks[current][i][1],"portal");

  });

 });
 pos.textContent=(current==="home"?"00":String(pages[current].index).padStart(2,"0"))+" / 24";
 
 showInscription("");syncArtwork();document.body.classList.toggle("is-home",current==="home");back.disabled=current==="home";
 const annotation=meta[current];$("fieldId").textContent=annotation?String(pages[current].index).padStart(2,"0")+" / "+annotation[0]:"";
 $("fieldCopy").textContent=annotation?annotation[1]:"";$("secondary").textContent="";$("secondary").classList.remove("shown");
 document.title=current==="home"?"KLAAT - Resonant Art":"KLAAT - Resonant Art | "+(annotation?.[0]||"Field");
 if(signalOn){const a=layer.querySelector(".node.audio");if(a){activeSoundNode=a;a.classList.add("playing")}}
}
function travel(id,replace){
 if(changing||!(id==="home"||pages[id]))return;
 if(!replace&&typeof window.gtag==="function")window.gtag("event","portal_enter",{portal_id:id,from_portal:current});
 changing=true;hover=-1;veil.classList.add("on");setTimeout(function(){
  if(replace){const at=path.lastIndexOf(id);path=at>=0?path.slice(0,at+1):["home",id]}else path.push(id);
  current=id;if(id!=="home"){been.add(id);try{localStorage.setItem("klaat_field_visited",JSON.stringify(Array.from(been)))}catch(e){}}
  if(!replace)history.pushState({field:id,routePath:path.slice(-48),enteredFromField:true},"","#"+id);
  placeNodes();veil.classList.remove("on");setTimeout(function(){changing=false},400)
 },reduceMotion?0:370)
}
function goBack(){
 if(current==="home")return;
 if(history.state&&history.state.enteredFromField){history.back();return}
 // Direct deep links did not originate from the field; return home instead of leaving the site.
 const prev=path.length>1?path[path.length-2]:"home";
 history.replaceState({field:prev,routePath:prev==="home"?["home"]:["home",prev],enteredFromField:false},"","#"+prev);
 travel(prev,true)
}
$("homeLink").addEventListener("click",function(e){e.preventDefault();if(current!=="home")travel("home");else history.replaceState({field:"home"},"","#home")});
back.addEventListener("click",goBack);
document.addEventListener("keydown",function(e){if(e.key==="Escape"||e.key==="Backspace"&&e.target.tagName!=="INPUT"){if(current!=="home"){e.preventDefault();goBack()}}});
window.addEventListener("popstate",function(e){
 const id=decodeURIComponent(location.hash.slice(1)||"home");
 if(id!=="home"&&!pages[id])return;
 const saved=e.state?.routePath;
 if(Array.isArray(saved)&&saved.length){
   path=saved.filter(n=>n==="home"||pages[n]).slice(-48);
   if(!path.includes(id))path.push(id);
 }else path=id==="home"?["home"]:["home",id];
 travel(id,true)
});

document.addEventListener("pointerdown",function(e){
 if(entrySoundRequested||signalOn||current!=="home")return;
 if(e.target.closest("a,#sound,#back"))return;
 entrySoundRequested=true;
 playVariation(0);
},{passive:true,capture:true});

let last=0;function animate(ms){
 if(!document.hidden&&ms-last>(reduceMotion?400:mobile?55:33)){
  audioLevel();now=ms*.001;draw(now);
  if(approvedArt[current])drawMotion(now);
  last=ms
 }
 requestAnimationFrame(animate)
}

 const b=approvedBounds(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;

},{passive:true});

if(hash&&pages[hash]){
