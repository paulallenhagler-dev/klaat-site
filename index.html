<title>KLAAT — Resonance Ritual</title>

<link rel="canonical" href="https://klaat.org/">
<meta property="og:type" content="website"><meta property="og:site_name" content="KLAAT"><meta property="og:url" content="https://klaat.org/"><meta property="og:title" content="KLAAT — Resonance Ritual"><meta property="og:description" content="Drone. Pulse. Breath. Repetition. An experimental acoustic project and living research inquiry from Kansas City."><meta property="og:image" content="https://klaat.org/assets/klaat-hero.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://klaat.org/assets/klaat-hero.png"><style>
:root{--void:#0A0A0C;--bone:#E8E2D6;--purple:#3B1E5A;--blue:#15323F}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--void);color:var(--bone)}
body{font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.stage{
  position:relative;width:100vw;height:100svh;min-height:550px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(circle at 50% 48%,rgba(59,30,90,.12),transparent 38%),
    radial-gradient(circle at 50% 55%,rgba(21,50,63,.08),transparent 62%),
    var(--void)
}
.hero{
  position:absolute;left:50%;top:51%;
  width:min(90vw,92vh,1040px);height:auto;
  transform:translate(-50%,-50%);
  opacity:.98;
  filter:drop-shadow(0 0 24px rgba(59,30,90,.10)) drop-shadow(0 0 54px rgba(21,50,63,.06));
  animation:fieldPulse 14s ease-in-out infinite;
  z-index:1
}
.wordmark-wrap{
  position:absolute;left:50%;top:7.2vh;transform:translateX(-50%);
  width:min(42vw,520px);z-index:3;text-align:center
}
.wordmark{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.75))}
.ritual{
  margin-top:10px;font-size:clamp(10px,1vw,13px);letter-spacing:.52em;text-indent:.52em;
  white-space:nowrap;text-shadow:0 2px 8px #000
}
.footer{
  position:absolute;z-index:4;left:50%;bottom:4.2vh;transform:translateX(-50%);
  text-align:center;width:min(92vw,900px);text-shadow:0 2px 10px #000
}
.enter { display:inline-flex;align-items:center;gap:1rem;justify-content:center;margin-bottom:23px;padding:14px 21px;
  color:var(--bone);text-decoration:none;border:1px solid rgba(232,226,214,.36);background:rgba(10,10,12,.68);
  letter-spacing:.26em;font-size:10px;text-transform:uppercase;transition:border-color .2s,background .2s }
.enter:hover,.enter:focus-visible{background:rgba(59,30,90,.35);border-color:var(--bone)}
.enter span{font-size:16px;line-height:0}
.elements{font-size:clamp(9px,.9vw,11px);letter-spacing:.34em;text-indent:.34em;opacity:.78;white-space:nowrap}
.place{margin-top:12px;font-size:9px;letter-spacing:.48em;text-indent:.48em;opacity:.48}
.dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--purple);
  vertical-align:middle;margin:0 .8em;box-shadow:0 0 9px rgba(59,30,90,.9)}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,10,12,.84) 0%,rgba(10,10,12,.12) 18%,transparent 34%,transparent 72%,rgba(10,10,12,.6) 100%),
    radial-gradient(ellipse at center,transparent 56%,rgba(10,10,12,.34) 100%)}
@keyframes fieldPulse{0%,100%{transform:translate(-50%,-50%) scale(.985);opacity:.94}50%{transform:translate(-50%,-50%) scale(1.018);opacity:1}}
@media(max-width:700px){
  .stage{min-height:500px}.hero{width:min(118vw,82vh);top:52%}
  .wordmark-wrap{top:6vh;width:min(68vw,430px)}
  .ritual{margin-top:8px;font-size:9px;letter-spacing:.38em;text-indent:.38em}
  .elements{font-size:8px;letter-spacing:.18em;text-indent:.18em;white-space:normal;line-height:1.8}
  .place{margin-top:7px}.enter{margin-bottom:20px}
}
@media(prefers-reduced-motion:reduce){.hero{animation:none}}
.quick-links{display:flex;justify-content:center;gap:13px;flex-wrap:wrap}.quick-links .enter{margin-bottom:20px}@media(max-width:700px){.quick-links{gap:8px}.quick-links .enter{padding:11px 12px;font-size:9px;letter-spacing:.14em;margin-bottom:16px}}
</style>
<link rel="stylesheet" href="/assets/klaat-sound.css"><script src="/assets/klaat-sound.js" defer></script></head>
<body>
<main class="stage" aria-label="KLAAT">
  <img class="hero" src="assets/klaat-hero.png" alt="" aria-hidden="true">
  <div class="vignette" aria-hidden="true"></div>
  <header class="wordmark-wrap">
    <img class="wordmark" src="assets/klaat-wordmark.png" alt="KLAAT">
    <div class="ritual">RESONANCE RITUAL</div>
  </header>
  <footer class="footer">
    <div class="quick-links"><a class="enter" href="about.html">EXPLORE KLAAT <span aria-hidden="true">↗</span></a><a class="enter" href="research.html">THE RESEARCH <span aria-hidden="true">↗</span></a></div>
    <div class="elements">DRONE <span class="dot"></span> PULSE <span class="dot"></span> BREATH <span class="dot"></span> REPETITION</div>
    <div class="place">KANSAS CITY · <a href="notes.html" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(232,226,214,.3)">FIELD NOTES ↗</a></div>
  </footer>
</main>
</body>
</html>
