 }
}
function guide(cx,cy,extent){linear(cx,cy-extent-38,cx,cy+extent+38,.16);linear(cx-extent-36,cy,cx+extent+36,cy,.12);for(let s of [-1,1]){dot(cx,cy+s*(extent+38),1.65,C.white,.64)}}
function dot(x,y,r,col,opacity){ctx.globalAlpha=opacity===undefined?1:opacity;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function dust(t,count,cx,cy,rad,seed){
 for(let i=0;i<count;i++){let a=(i*2.39996+seed), rr=(.14+((i*57)%113)/130)*rad,shift=(1+Math.sin(i*13.4+t*.15))*.007*rad;let x=cx+Math.cos(a+t*.007*Math.sin(i))*rr+shift,y=cy+Math.sin(a-t*.004)*rr*.7;dot(x,y,((i*11)%5===0?1.8:.65),i%19===0?C.rust:C.bone,.16+(i%9)/36)}
}
function cross(x,y,scale){linear(x-scale,y,x+scale,y,.26);linear(x,y-scale,x,y+scale,.26);dot(x,y,2.8,C.red,.92)}
function drawHome(t){
 if(!mobile){
  let cx=W*.236,cy=H*.505,rr=Math.min(W*.173,H*.31);
  guide(cx,cy,rr+4);rings(cx,cy,rr,22,t,.27);ribbon(cx+4,cy,W*.78,22,t,6.2);cross(cx,cy,4);
  dot(W*.112,cy,4,C.rust,1);dot(cx,cy-rr-45,2,C.white,.85);dot(cx,cy+rr+45,2,C.white,.85);
  linear(W*.04,H*.073,W*.96,H*.073,.34);
 }else{
  let cx=W*.5,cy=H*.425,rr=Math.min(W*.39,H*.18);
  guide(cx,cy,rr);rings(cx,cy,rr,18,t,.34);cross(cx,cy,4);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.PI/2);ribbon(0,0,H*.65,17,t,4.1);ctx.restore();
  dot(cx-rr-9,cy,3.4,C.rust,1);dot(cx,cy-rr-29,2,C.white,.75);
 }
}
function strikes(cx,cy,t,seed){
 const n=19, span=Math.min(W*.68,920);
 linear(cx-span*.55,cy,cx+span*.55,cy,.1);
 for(let i=0;i<n;i++){let x=cx-span*.48+i*span*.96/(n-1),v=Math.sin(i*2.34+seed)*.5+.5;
 let h=22+v*86+(Math.cos(i*.75+t*.48)*6);if(i===9||i===14)continue;
 linear(x,cy-h,x,cy+h,.15+v*.26);if(i%3===0)dot(x,cy-h,1.65,i%2?C.teal:C.bone,.75)}
 dot(cx,cy,3,C.red,1);
}
function lattice(cx,cy,t,seed){
 let rw=Math.min(W*.72,1100),rh=Math.min(H*.6,600);
 for(let j=-11;j<=11;j++){ctx.beginPath();for(let k=0;k<=80;k++){let xx=cx-rw*.5+k*rw/80;let yy=cy+j*rh/30+Math.sin((xx-cx)*.009+j*.33+t*.3)*8+Math.sin(k*.19+t*.45+seed)*2;if(k===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.strokeStyle="rgba(219,212,197,"+(.12+(11-Math.abs(j))*.011)+")";ctx.lineWidth=.65;ctx.stroke()}
 for(let i=0;i<11;i++){let xx=cx-rw*.44+i*rw*.088;linear(xx,cy-rh*.29,xx,cy+rh*.29,.065)}
}
function spiral(cx,cy,t,seed){
 ctx.beginPath();for(let i=0;i<=1600;i++){let a=i/64*2*Math.PI*.75;let r=12+i*.115+2*Math.sin(a*4+t*.25+seed);let x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle="rgba(224,214,199,.38)";ctx.lineWidth=.85;ctx.stroke();for(let i=0;i<15;i++){let a=i*2.4,rr=30+i*12;dot(cx+rr*Math.cos(a),cy+rr*Math.sin(a),i%5===0?2.4:1.2,i%5===0?C.teal:C.bone,.62)}
}
function roomArt(mode,index,t){
 const cx=mobile?W*.5:W*.40,cy=mobile?H*.47:H*.52;
 const r=Math.min(W*(mobile?.37:.185),H*.29);
 if(mode==="arc"){guide(cx,cy,r);rings(cx,cy,r,21,t,.42);if(!mobile)ribbon(cx+9,cy,W*.7,16,t,5.4);else{ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.PI/2);ribbon(0,0,H*.5,16,t,3.5);ctx.restore()}}
 if(mode==="ribbon"){if(!mobile){rings(cx-W*.09,cy,r*.52,10,t,.37);ribbon(cx-W*.08,cy,W*.8,25,t,5.8)}else{rings(cx,cy-H*.06,r*.64,12,t,.33);ctx.save();ctx.translate(cx,cy-H*.04);ctx.rotate(Math.PI/2);ribbon(0,0,H*.59,21,t,4);ctx.restore()}}
 if(mode==="ticks"){strikes(mobile?W*.5:W*.51,cy,t,index)}
 if(mode==="double"){rings(cx-r*.4,cy-r*.17,r*.75,14,t,.14);rings(cx+r*.55,cy+r*.16,r*.78,14,-t,.14);linear(cx-r*1.5,cy+r*.07,cx+r*1.5,cy+r*.07,.13);dot(cx-r*.4,cy-r*.17,3.1,C.red,1)}
 if(mode==="axis"){guide(cx,cy,r);rings(cx,cy,r*.8,12,t,1.04);for(let i=0;i<17;i++){let y=cy-r+i*(r*2/16);linear(cx-r*.6,y,cx+r*.6,y,i===8?.32:.08)}}
 if(mode==="fracture"){rings(cx,cy,r,20,t,.58);for(let i=0;i<21;i++){let y=cy+(i-10)*r*.12;linear(cx+Math.sin(i*.85+t*.32)*r*.21,y,cx+r*.65,y,.15+i*.006)}}
 if(mode==="echo"){for(let i=0;i<4;i++)rings(cx+(i-1.5)*r*.2,cy+(i-1.5)*r*.03,r*.59,8,t+i*.3,.3);linear(cx-r*1.5,cy,cx+r*1.5,cy,.12)}
 if(mode==="lattice"){lattice(mobile?W*.5:W*.5,cy,t,index)}
 if(mode==="spiral"){spiral(mobile?W*.5:W*.49,cy,t,index);guide(mobile?W*.5:W*.49,cy,r)}
 if(mode==="dust"){rings(cx,cy,r*.58,11,t,.2);dust(t,260, mobile?W*.5:W*.56,cy,r*1.6,index);cross(cx,cy,4)}
 if(mode==="veil"){for(let i=-13;i<=13;i++){ctx.beginPath();for(let k=0;k<=90;k++){let q=k/90,y=H*(mobile?.26:.14)+q*H*.76,x=cx+i*4.4+Math.sin(q*12+t*.38+i*.17)*r*.24*q;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle="rgba(218,211,197,"+(.10+.21*(1-Math.abs(i)/14))+")";ctx.lineWidth=.7;ctx.stroke()}}
 if(mode==="glyph"){guide(cx,cy,r*.95);for(let i=0;i<4;i++){let x=cx+(i-1.5)*r*.75, y=cy+Math.sin(i*1.8)*r*.1;ctx.beginPath();ctx.arc(x,y,r*.23,.18+i*.2,Math.PI*1.78+i*.1);ctx.strokeStyle="rgba(219,211,196,.36)";ctx.lineWidth=.8;ctx.stroke();dot(x,y,2.4,i===0?C.red:C.bone,.87)}}
 if(mode!=="dust")dust(t,26, mobile?W*.5:W*.6,cy,r*1.7,index);
}
function draw(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#080808";ctx.fillRect(0,0,W,H);
 if(current==="home")drawHome(t);else if(!approvedArt[current]){let s=pages[current];roomArt(s.mode,s.index,t)}
 if(hover!==-1){let b=layer.children[hover];if(b){let r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(x,y,21+i*13+Math.sin(t*1.4+i)*2,0,Math.PI*2);ctx.strokeStyle="rgba(211,204,186,"+(.12/(i+1))+")";ctx.lineWidth=.7;ctx.stroke()}}}
}
function placements(){
 if(current==="home"){
  if(!mobile)return [[.236,.505],[.112,.505],[.53,.51],[.78,.60],[.65,.40],[.91,.52],[.37,.70]];
  return [[.5,.425],[.20,.45],[.76,.56],[.23,.70],[.75,.72],[.51,.68],[.50,.83]];
 }
 if(approvedArt[current]){const r=approvedBounds();return approvedMarks[current].map(p=>[(r.left+p[0]*r.width)/W,(r.top+p[1]*r.height)/H])}
 if(!mobile)return [[.40,.52],[.59,.43],[.76,.61],[.28,.30]];
 return [[.50,.45],[.73,.42],[.70,.63],[.28,.62]];
}
function destinations(){return current==="home"?homeDest:pages[current].links}
function placeNodes(){
 if(!W||!H)return;
 layer.replaceChildren();hover=-1;const pts=placements(),targets=destinations();
 targets.forEach(function(dest,i){
  const a=document.createElement("button"),action=dest==="@audio"?"audio":dest==="@read"||dest[0]==="/"?"read":dest==="@observe"?"observe":"portal";
  a.className="node "+action+(approvedArt[current]?" approved":"");a.type="button";a.style.setProperty("--x",(pts[i][0]*100)+"%");a.style.setProperty("--y",(pts[i][1]*100)+"%");
  a.style.setProperty("--col",action==="audio"?C.teal:action==="read"?C.bone:action==="observe"?C.purple:i%3===0?C.red:C.rust);
  a.style.setProperty("--dot",i===0?"7px":(action==="audio"?"5.5px":"4.5px"));
  const targetName=meta[dest]?.[0]||dest;
  a.setAttribute("aria-label",action==="audio"?"Play a KLAAT sound variation":action==="read"?"Read the full Atlas":action==="observe"?"Reveal another observation":"Enter "+targetName);
  a.title=action==="audio"?"SOUND":action==="read"?"ATLAS":action==="observe"?"OBSERVATION":targetName;
  a.innerHTML='<span class="ring"></span><span class="ring two"></span><span class="ink"></span>';
  a.addEventListener("mouseenter",function(){hover=i;hint.classList.add("disappear")});a.addEventListener("mouseleave",function(){hover=-1});
  a.addEventListener("focus",function(){hover=i});a.addEventListener("blur",function(){hover=-1});
  a.addEventListener("click",function(){
   a.classList.add("tapped");
   if(action==="audio"){playVariation(Math.floor(Math.random()*audioModes.length));return}
   if(action==="read"){location.href=dest[0]==="/"?dest:"/edition.html";return}
   if(action==="observe"){const e=$("secondary");e.textContent=meta[current]?.[2]||"";e.classList.add("shown");return}
   travel(dest)
  });
  layer.appendChild(a)
 });
 pos.textContent=(current==="home"?"00":String(pages[current].index).padStart(2,"0"))+" / 24";
 trail.replaceChildren();path.slice(-9).forEach(function(_,i,arr){let a=document.createElement("i");if(i===arr.length-1)a.className="latest";trail.appendChild(a)});
 syncArtwork();document.body.classList.toggle("is-home",current==="home");back.disabled=current==="home";
 const annotation=meta[current];$("fieldId").textContent=annotation?String(pages[current].index).padStart(2,"0")+" / "+annotation[0]:"";
 $("fieldCopy").textContent=annotation?annotation[1]:"";$("secondary").textContent="";$("secondary").classList.remove("shown");
 document.title=current==="home"?"KLAAT — The Living Field":"KLAAT — "+(annotation?.[0]||"Field");
 if(signalOn){const a=layer.querySelector(".node.audio");if(a){activeSoundNode=a;a.classList.add("playing")}}
}
function travel(id,replace){
 if(changing||!(id==="home"||pages[id]))return;
 changing=true;hover=-1;veil.classList.add("on");setTimeout(function(){
  if(replace){const at=path.lastIndexOf(id);path=at>=0?path.slice(0,at+1):["home",id]}else path.push(id);
  current=id;if(id!=="home"){been.add(id);try{localStorage.setItem("klaat_field_visited",JSON.stringify(Array.from(been)))}catch(e){}}
  if(!replace)history.pushState({field:id},"","#"+id);placeNodes();veil.classList.remove("on");setTimeout(function(){changing=false},400)
 },reduceMotion?0:370)
}
function goBack(){
 if(path.length<2){if(current!=="home")travel("home",true);return}
 const prev=path[path.length-2];path.pop();travel(prev,true)
}
$("homeLink").addEventListener("click",function(e){e.preventDefault();if(current!=="home")travel("home");else history.replaceState({field:"home"},"","#home")});
back.addEventListener("click",goBack);
document.addEventListener("keydown",function(e){if(e.key==="Escape"||e.key==="Backspace"&&e.target.tagName!=="INPUT"){if(current!=="home"){e.preventDefault();goBack()}}});
window.addEventListener("popstate",function(){const id=decodeURIComponent(location.hash.slice(1)||"home");if(id==="home"||pages[id])travel(id,true)});
sound.addEventListener("click",function(){if(signalOn){stopAudio();return}let choice=Math.floor(Math.random()*audioModes.length);if(audioModes.length>1&&choice===currentMode)choice=(choice+1)%audioModes.length;playVariation(choice)});
audio.addEventListener("pause",function(){if(signalOn)stopAudio()});
audio.addEventListener("error",function(){$("audioLabel").textContent="AUDIO UNAVAILABLE";$("audioLabel").classList.add("active")});
let last=0;function animate(ms){if(!document.hidden&&ms-last>(reduceMotion?250:mobile?36:30)){audioLevel();now=ms*.001;draw(now);last=ms}requestAnimationFrame(animate)}
window.addEventListener("resize",size,{passive:true});size();
const hash=decodeURIComponent(location.hash.slice(1));if(hash&&pages[hash]){current=hash;path=["home",hash];been.add(hash);placeNodes()}else if(!hash){history.replaceState({field:"home"},"","#home")}
requestAnimationFrame(animate);
})();
</script>
