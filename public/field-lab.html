  a.addEventListener("focus",function(){hover=i});a.addEventListener("blur",function(){hover=-1});
  a.addEventListener("click",function(){a.classList.add("tapped");if(dest[0]==="/"){location.href=dest;return}travel(dest)});
  layer.appendChild(a)
 })
 pos.textContent=(current==="home"?"00":String(pages[current].index).padStart(2,"0"))+" / 24";
 trail.replaceChildren();path.slice(-9).forEach(function(_,i,arr){let a=document.createElement("i");if(i===arr.length-1)a.className="latest";trail.appendChild(a)});
 document.body.classList.toggle("is-home",current==="home");back.disabled=current==="home";document.title=current==="home"?"KLAAT — The Living Field":"KLAAT — Field "+String(pages[current].index).padStart(2,"0");
}
function travel(id,replace){
 if(changing||!(id==="home"||pages[id]))return;
 changing=true;hover=-1;veil.classList.add("on");setTimeout(function(){
  if(replace){const at=path.lastIndexOf(id);path=at>=0?path.slice(0,at+1):["home",id]}else path.push(id);
  current=id;if(id!=="home"){been.add(id);try{localStorage.setItem("klaat_field_visited",JSON.stringify(Array.from(been)))}catch(e){}}
  if(!replace)history.pushState({field:id},"","#"+id);placeNodes();veil.classList.remove("on");setTimeout(function(){changing=false},400)
 },reduceMotion?0:370)
}
function goBack(){
 if(path.length<2){if(current!=="home")travel("home",true);return}
 const prev=path[path.length-2];path.pop();travel(prev,true)
}
$("homeLink").addEventListener("click",function(e){e.preventDefault();if(current!=="home")travel("home");else history.replaceState({field:"home"},"","#home")});
back.addEventListener("click",goBack);
document.addEventListener("keydown",function(e){if(e.key==="Escape"||e.key==="Backspace"&&e.target.tagName!=="INPUT"){if(current!=="home"){e.preventDefault();goBack()}}});
window.addEventListener("popstate",function(){const id=decodeURIComponent(location.hash.slice(1)||"home");if(id==="home"||pages[id])travel(id,true)});
sound.addEventListener("click",async function(){try{if(audio.paused){await audio.play();sound.setAttribute("aria-pressed","true")}else{audio.pause();sound.setAttribute("aria-pressed","false")}}catch(e){sound.setAttribute("aria-pressed","false")}});
audio.addEventListener("pause",function(){sound.setAttribute("aria-pressed","false")});audio.addEventListener("play",function(){sound.setAttribute("aria-pressed","true")});
let last=0;function animate(ms){if(ms-last>(reduceMotion?240:30)){now=ms*.001;draw(now);last=ms}requestAnimationFrame(animate)}
window.addEventListener("resize",size,{passive:true});size();
const hash=decodeURIComponent(location.hash.slice(1));if(hash&&pages[hash]){current=hash;path=["home",hash];been.add(hash);placeNodes()}else if(!hash){history.replaceState({field:"home"},"","#home")}
requestAnimationFrame(animate);
})();
</script>
